<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student QR Event Pass Generator</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 450px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        button { background-color: #232f3e; color: white; border: none; font-weight: bold; cursor: pointer; }
        .result { text-align: center; margin-top: 20px; }
        img { max-width: 200px; border: 1px solid #ddd; padding: 5px; }
    </style>
</head>
<body>
    <h2>Student Event Registration</h2>
    <form method="POST">
        <label>Full Name</label>
        <input type="text" name="name" required placeholder="e.g., Jane Doe">

        <label>Registration Number</label>
        <input type="text" name="reg_no" required placeholder="e.g., 22BCE1234">
        
        <button type="submit">Generate Pass</button>
    </form>

    {% if qr_url %}
    <div class="result">
        <h3>Pass Generated Successfully!</h3>
        <img src="{{ qr_url }}" alt="QR Code Pass">
        <p>Image saved locally at: <code>{{ qr_url }}</code></p>
    </div>
    {% endif %}
</body>
</html>
